<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experience Vault</title>
<meta name="description" content="Clark Ngo's interview story library: STAR-format behavioral and technical answers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --ink: #1c1b19;
    --muted: #6b675f;
    --line: #e4e0d6;
    --accent: #1f5f5b;
    --accent-soft: #e2eeec;
    --warn: #8a5a00;
    --warn-soft: #fbefd5;
    --cat-behavioral: #7a4fb0;
    --cat-technical: #1f5f5b;
    --cat-system: #2d5fa8;
    --cat-leadership: #a8452d;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --surface: #1d1c1a; --ink: #ecebe6; --muted: #a29e94; --line: #2f2d29;
      --accent: #6fc2b9; --accent-soft: #1d3331; --warn: #f0c46a; --warn-soft: #3a2e14;
      --cat-behavioral: #b896e6; --cat-technical: #6fc2b9; --cat-system: #86aef0; --cat-leadership: #ee9a83;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --surface: #1d1c1a; --ink: #ecebe6; --muted: #a29e94; --line: #2f2d29;
    --accent: #6fc2b9; --accent-soft: #1d3331; --warn: #f0c46a; --warn-soft: #3a2e14;
    --cat-behavioral: #b896e6; --cat-technical: #6fc2b9; --cat-system: #86aef0; --cat-leadership: #ee9a83;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }

  header { padding: 56px 0 24px; }
  .eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 650; font-size: clamp(34px, 6vw, 48px); line-height: 1.1; margin: 0 0 12px; }
  .lede { color: var(--muted); max-width: 60ch; margin: 0; }
  .stats { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 24px; font-size: 14px; color: var(--muted); }
  .stats b { display: block; font-family: Fraunces, Georgia, serif; font-size: 26px; color: var(--ink); font-weight: 500; }

  .controls { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0; border-bottom: 1px solid var(--line); }
  .search {
    width: 100%; padding: 11px 14px; font: inherit; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    font: 500 13px Inter, sans-serif; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tag-filter { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .tag-filter button { font: inherit; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 0; text-decoration: underline; }

  main { padding: 24px 0 64px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }

  .card { scroll-margin-top: 140px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
  .card > summary { list-style: none; cursor: pointer; padding: 18px 20px; }
  .card > summary::-webkit-details-marker { display: none; }
  .card > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .cat { font-weight: 600; }
  .cat::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
  .cat[data-c="Behavioral"] { color: var(--cat-behavioral); }
  .cat[data-c="Technical"] { color: var(--cat-technical); }
  .cat[data-c="System Design"] { color: var(--cat-system); }
  .cat[data-c="Leadership"] { color: var(--cat-leadership); }
  .draft { color: var(--warn); background: var(--warn-soft); padding: 1px 8px; border-radius: 999px; font-weight: 500; }
  .card h2 { font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 20px; line-height: 1.3; margin: 0; }
  .project { font-size: 14px; color: var(--muted); margin-top: 4px; }

  .body { padding: 0 20px 20px; border-top: 1px solid var(--line); }
  .star { display: grid; grid-template-columns: 34px 1fr; gap: 0 14px; margin-top: 18px; }
  .letter {
    width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); font: 650 16px Fraunces, Georgia, serif;
  }
  .star h3 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); line-height: 34px; }
  .star p { grid-column: 2; margin: 2px 0 0; }
  mark.confirm { background: var(--warn-soft); color: var(--warn); border-radius: 4px; padding: 0 4px; font-size: .92em; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
  .tag { font: 12px Inter, sans-serif; padding: 3px 9px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); cursor: pointer; }
  .tag:hover { color: var(--ink); }

  footer { border-top: 1px solid var(--line); padding: 24px 0 48px; font-size: 14px; color: var(--muted); }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<header class="wrap">
  <p class="eyebrow">Clark Ngo · Interview story library</p>
  <h1>Experience Vault</h1>
  <p class="lede">Behavioral, technical, system design and leadership stories in STAR format, from my work in software engineering, AI, program leadership and finance.</p>
  <div class="stats" id="stats"></div>
</header>

<div class="controls">
  <div class="wrap">
    <input class="search" id="q" type="search" placeholder="Search stories, e.g. RAG, conflict, microservices" aria-label="Search stories">
    <div class="chips" id="cats" role="group" aria-label="Filter by category"></div>
    <div class="tag-filter" id="tagFilter" hidden></div>
  </div>
</div>

<main class="wrap" id="list" aria-live="polite"></main>

<footer class="wrap">
  Source data: <a href="stories.json">stories.json</a> · <a href="https://github.com/clarkngo/experience-vault">GitHub</a>
</footer>

<script>
  const CATEGORIES = ["All", "Behavioral", "Technical", "System Design", "Leadership"];
  const STAR = [["S", "Situation", "situation"], ["T", "Task", "task"], ["A", "Action", "action"], ["R", "Result", "result"]];
  const state = { q: "", cat: "All", tag: null };
  let stories = [];

  const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const markConfirm = s => esc(s).replace(/\[confirm:[^\]]*\]/g, m => `<mark class="confirm">${m}</mark>`);
  const isDraft = s => STAR.some(([, , k]) => s[k].includes("[confirm:"));

  function renderStats() {
    const drafts = stories.filter(isDraft).length;
    const projects = new Set(stories.map(s => s.relatedProject)).size;
    document.getElementById("stats").innerHTML =
      `<div><b>${stories.length}</b>stories</div><div><b>${projects}</b>projects</div>` +
      (drafts ? `<div><b>${drafts}</b>still in draft</div>` : "");
  }

  function renderChips() {
    const el = document.getElementById("cats");
    el.innerHTML = CATEGORIES.map(c => {
      const n = c === "All" ? stories.length : stories.filter(s => s.category === c).length;
      return `<button class="chip" data-cat="${c}" aria-pressed="${state.cat === c}">${c} · ${n}</button>`;
    }).join("");
  }

  function matches(s) {
    if (state.cat !== "All" && s.category !== state.cat) return false;
    if (state.tag && !s.tags.includes(state.tag)) return false;
    if (!state.q) return true;
    const hay = [s.title, s.relatedProject, s.tags.join(" "), ...STAR.map(([, , k]) => s[k])].join(" ").toLowerCase();
    return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
  }

  function renderList() {
    const shown = stories.filter(matches);
    const tf = document.getElementById("tagFilter");
    tf.hidden = !state.tag;
    if (state.tag) tf.innerHTML = `Tag: <strong>${esc(state.tag)}</strong> · <button id="clearTag">clear</button>`;
    document.getElementById("list").innerHTML = shown.length ? shown.map(s => `
      <details class="card" id="${esc(s.id)}">
        <summary>
          <div class="meta">
            <span class="cat" data-c="${esc(s.category)}">${esc(s.category)}</span>
            ${isDraft(s) ? '<span class="draft">draft</span>' : ""}
          </div>
          <h2>${esc(s.title)}</h2>
          <div class="project">${esc(s.relatedProject)}</div>
        </summary>
        <div class="body">
          ${STAR.map(([l, label, k]) => `
            <div class="star"><span class="letter">${l}</span><h3>${label}</h3><p>${markConfirm(s[k])}</p></div>`).join("")}
          <div class="tags">${s.tags.map(t => `<button class="tag" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}</div>
        </div>
      </details>`).join("") : `<p class="empty">No stories match.</p>`;
  }

  document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim(); renderList(); });
  document.addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (chip) { state.cat = chip.dataset.cat; renderChips(); renderList(); return; }
    const tag = e.target.closest(".tag");
    if (tag) { state.tag = tag.dataset.tag; renderList(); window.scrollTo({ top: document.querySelector(".controls").offsetTop, behavior: "smooth" }); return; }
    if (e.target.id === "clearTag") { state.tag = null; renderList(); }
  });

  function openFromHash() {
    const d = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (d) { d.open = true; d.scrollIntoView(); }
  }
  window.addEventListener("hashchange", openFromHash);

  fetch("stories.json")
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      stories = data;
      renderStats(); renderChips(); renderList();
      openFromHash();
    })
    .catch(() => { document.getElementById("list").innerHTML = '<p class="empty">Could not load stories.json.</p>'; });
</script>
</body>
</html>
